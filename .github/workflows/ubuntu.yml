---
name: Ubuntu
permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  perl:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        perl-version:
          - '5.36'
          - '5.38'
          - '5.40'
          - '5.42'

    name: Perl ${{ matrix.perl-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@a99edab616eaa8a66bbc16363c77a83361e5f2ce # v1.44.3
        with:
          perl-version: ${{ matrix.perl-version }}

      - name: Install CPAN dependencies
        run: |
          cpanm --notest --installdeps .

      - name: Run tests
        run: |
          perl Makefile.PL
          make
          make test
